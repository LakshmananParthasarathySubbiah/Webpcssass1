<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Layout</title>
    <style>
        /* Basic Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #fdf2f2;
        }

        /* Container Setup */
        .container {
            display: grid;
            gap: 10px;
            text-align: center;
        }

        /* Common Box Styling */
        .container > div {
            border: 2px solid #e74c3c;
            padding: 15px;
            background: white;
            color: #333;
        }

        /* 1. MOBILE LAYOUT (Default) */
        .container {
            grid-template-areas: 
                "header"
                "nav"
                "main"
                "sidebar"
                "ads"
                "footer";
        }

        /* 2. TABLET LAYOUT */
        @media (min-width: 600px) and (max-width: 1023px) {
            .container {
                grid-template-columns: 1fr 3fr; /* Sidebar is thinner than main */
                grid-template-areas: 
                    "header header"
                    "nav nav"
                    "sidebar main"
                    "ads footer";
            }
        }

        /* 3. DESKTOP LAYOUT */
        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 1fr 3fr 1fr;
                grid-template-areas: 
                    "header header header"
                    "sidebar nav ads"
                    "sidebar main ads"
                    "footer footer footer";
            }
            
            /* Main is taller in the desktop mockup */
            .main { min-height: 300px; }
        }

        /* Assigning Grid Areas */
        .header  { grid-area: header; }
        .nav     { grid-area: nav; }
        .sidebar { grid-area: sidebar; }
        .main    { grid-area: main; }
        .ads     { grid-area: ads; }
        .footer  { grid-area: footer; }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">header</div>
        <div class="nav">navigation</div>
        <div class="sidebar">sidebar</div>
        <div class="main">main</div>
        <div class="ads">ads</div>
        <div class="footer">footer</div>
    </div>

</body>
